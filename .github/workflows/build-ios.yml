name: 编译iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: xcodebuild -version
    - run: |
        xcodebuild -project "长须鲸手机工具.xcodeproj" -scheme "长须鲸手机工具" \
          -configuration Release -destination 'generic/platform=iOS' \
          -archivePath build/长须鲸手机工具.xcarchive archive \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    - run: |
        cat > exportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict><key>method</key><string>development</string></dict></plist>
        EOF
        xcodebuild -exportArchive -archivePath build/长须鲸手机工具.xcarchive \
          -exportPath export -exportOptionsPlist exportOptions.plist \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        mv export/*.ipa export/mobile_tool.ipa
    - uses: actions/upload-artifact@v4
      with:
        name: mobile_tool.ipa
        path: export/mobile_tool.ipa
